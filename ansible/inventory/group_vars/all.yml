---
# Каталог комплекта на целевых хостах
sn_remote_root: /opt/sn-lsp-auto

# Пакеты в корне комплекта (packages-astra / packages / packages-alt)
# playbook_dir = .../ansible/playbooks → корень репо на два уровня выше
sn_files_root: "{{ playbook_dir }}/../.."

# copy | mirror
sn_pkg_mode: copy

# Для mirror: HTTP-каталог или уже смонтированный путь на хосте
sn_pkg_url: ""
sn_pkg_share: ""

# Относительные имена каталогов пакетов (под sn_files_root)
sn_pkg_dirs:
  astra: packages-astra
  redos: packages
  alt: packages-alt

# Лицензия (учебный стенд; один ключ лежит во всех packages*)
sn_license_src: packages-astra/26962ED_key.lic

# Минимальное свободное место на / (ГБ) для ready
sn_min_free_gb: 2

# Сколько reboot-циклов установки (PHASE 0→1→3→5) допускаем
sn_max_reboots: 3

# Таймаут ожидания после reboot
sn_reboot_timeout: 900

# Отчёты диагностики
sn_reports_dir: "{{ playbook_dir }}/../reports"

# Корень комплекта sn-lsp-auto (скрипты install/configure/backup)
sn_kit_root: "{{ playbook_dir }}/../.."

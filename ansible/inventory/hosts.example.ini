# Скопируйте в hosts.ini и заполните реальными хостами:
#   cp inventory/hosts.example.ini inventory/hosts.ini
#
# На jump: SSH-ключ без пароля + sudo без пароля (или ansible_become_password).

# Control node (jump). Нужен, чтобы group_vars доходили до локальных задач.
[controller]
localhost ansible_connection=local

[arm]
# arm-01 ansible_host=10.0.0.11
# arm-02 ansible_host=10.0.0.12

[servers]
# srv-01 ansible_host=10.0.0.5
# srv-db ansible_host=10.0.0.6

[sn_targets:children]
arm
servers

[sn_targets:vars]
ansible_user = root
# ansible_user = adminka
# ansible_become = true
# ansible_python_interpreter = auto_silent

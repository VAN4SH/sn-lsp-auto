# Скопируйте в hosts.ini и заполните реальными хостами:
#   cp inventory/hosts.example.ini inventory/hosts.ini
#
# Диагностика (01) — достаточно SSH под ansible_user, sudo не нужен.
# Установка (02) — нужен root/sudo: Ansible спросит пароль (BECOME).
# Либо настройте NOPASSWD для administrator, либо ansible_user=root.

# Control node (jump).
[controller]
localhost ansible_connection=local

[arm]
# arm-01 ansible_host=10.0.0.11
# arm-02 ansible_host=10.0.0.12

[servers]
# srv-01 ansible_host=10.0.0.5
# srv-db ansible_host=10.0.0.6

[sn_targets:children]
arm
servers

[sn_targets:vars]
ansible_user = administrator
# ansible_user = root
# ansible_user = adminka
# ansible_python_interpreter = auto_silent
# Для установки без -K (если настроен NOPASSWD):
# ansible_become = true
# ansible_become_user = root

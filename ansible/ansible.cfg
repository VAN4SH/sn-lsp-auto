[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent
timeout = 30
gathering = smart
fact_caching = memory

[callback_default]
result_format = yaml

# По умолчанию без sudo: диагностика идёт под ansible_user (administrator и т.п.).
# Установка включает become в плейбуке и спросит пароль sudo (become_ask_pass).
# Если настроен NOPASSWD — пароль не понадобится. Либо передайте -K явно.
[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30

---
# Диагностика парка: факты → reports/<timestamp>/summary.csv + ready.txt / blocked.txt
#
#   cd ansible
#   cp inventory/hosts.example.ini inventory/hosts.ini   # заполнить
#   ansible-playbook playbooks/01-diagnose.yml
#
# Сверка: открыть summary.csv, затем установку:
#   ansible-playbook playbooks/02-install.yml --limit @reports/<ts>/ready.txt

- name: Prepare report timestamp on control node
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Make reports directory
      ansible.builtin.file:
        path: "{{ sn_reports_dir }}"
        state: directory
        mode: "0755"

    - name: Stamp run
      ansible.builtin.set_fact:
        sn_report_stamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: Report path
      ansible.builtin.set_fact:
        sn_report_path: "{{ sn_reports_dir }}/{{ sn_report_stamp }}"

    - name: Build kernel matrix map from packages on jump (if present)
      ansible.builtin.shell: |
        set -e
        MAP_FILE="{{ sn_reports_dir }}/.matrix_{{ sn_report_stamp }}.txt"
        : > "$MAP_FILE"
        list_k() {
          local os="$1" dir="$2"
          local pkg
          pkg="$(find "$dir" -maxdepth 1 \( -name 'sn-lsp_*.deb' -o -name 'sn-lsp*.rpm' \) ! -name '*firewall*' 2>/dev/null | head -n1)"
          if [[ -z "$pkg" ]]; then
            echo "${os}|__none__" >> "$MAP_FILE"
            return
          fi
          bash "{{ playbook_dir }}/../roles/sn_diagnose/files/list_kernels.sh" "$pkg" | while read -r k; do
            [[ -n "$k" ]] && echo "${os}|${k}" >> "$MAP_FILE"
          done
        }
        ROOT="{{ sn_files_root }}"
        list_k astra "$ROOT/packages-astra"
        list_k redos "$ROOT/packages"
        list_k alt "$ROOT/packages-alt"
        cat "$MAP_FILE"
      args:
        executable: /bin/bash
      register: sn_matrix_raw
      changed_when: false
      failed_when: false

    - name: Materialize kernel_in_matrix lookup dict
      ansible.builtin.set_fact:
        sn_kernel_matrix_map: >-
          {{
            {
              'astra': {},
              'redos': {},
              'alt': {}
            }
          }}

    - name: Fill matrix map
      ansible.builtin.set_fact:
        sn_kernel_matrix_map: >-
          {{
            sn_kernel_matrix_map | combine({
              item.split('|')[0]: (
                sn_kernel_matrix_map[item.split('|')[0]] | default({})
                | combine({item.split('|')[1]: 'yes'})
              )
            }, recursive=True)
          }}
      loop: "{{ (sn_matrix_raw.stdout_lines | default([])) | reject('search', '__none__') | list }}"
      when: sn_matrix_raw is succeeded and (sn_matrix_raw.stdout_lines | default([]) | length) > 0

- name: Collect diagnosis from targets
  hosts: sn_targets
  gather_facts: false
  become: false
  vars:
    sn_kernel_matrix_map: "{{ hostvars['localhost']['sn_kernel_matrix_map'] | default({'astra': {}, 'redos': {}, 'alt': {}}) }}"
  roles:
    - role: sn_diagnose

- name: Write reports on control node
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  vars:
    sn_report_path: "{{ hostvars['localhost']['sn_report_path'] }}"
  tasks:
    - name: Assemble rows
      ansible.builtin.set_fact:
        sn_report_rows: >-
          {{
            groups['sn_targets']
            | map('extract', hostvars, 'sn_diagnosis')
            | select('defined')
            | list
          }}

    - name: Ensure report directory
      ansible.builtin.file:
        path: "{{ sn_report_path }}"
        state: directory
        mode: "0755"

    - name: Write JSON/CSV/lists
      ansible.builtin.shell: |
        python3 "{{ playbook_dir }}/../roles/sn_diagnose/files/write_report.py" "{{ sn_report_path }}" <<'EOF'
        {{ sn_report_rows | to_nice_json }}
        EOF
      args:
        executable: /bin/bash
      register: sn_report_write

    - name: Show report location
      ansible.builtin.debug:
        msg:
          - "Report: {{ sn_report_path }}"
          - "{{ sn_report_write.stdout_lines | default([]) }}"
          - "Install ready hosts: ansible-playbook playbooks/02-install.yml --limit @{{ sn_report_path }}/ready.txt"

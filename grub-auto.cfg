set default="0"
set timeout=5

function load_video {
  if [ x$feature_all_video_module =xy ]; then
    insmod all_video
  else
    insmod efi_gop
    insmod efi_uga
    insmod ieee1275_fb
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
  fi
}

load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2
set gfxmode=1024x768,800x600,640x480
insmod gfxterm
terminal_output gfxterm

search --no-floppy --set=root -l 'redos-DVD-x86_64-8'

menuentry 'Auto install RedOS Clean (kickstart)' --class redos --class gnu-linux --class gnu --class os {
        linux /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=redos-DVD-x86_64-8 inst.ks=http://10.0.2.2:8765/redos8_ks.cfg nomodeset inst.text quiet inst.kdump_addon=off
        initrd /images/pxeboot/initrd.img
}
menuentry 'Manual install RedOS 8' --class redos --class gnu-linux --class gnu --class os {
        linux /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=redos-DVD-x86_64-8 nomodeset quiet inst.kdump_addon=off
        initrd /images/pxeboot/initrd.img
}

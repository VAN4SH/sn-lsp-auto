#version=RHEL8
# Clean RedOS 8 — без Secret Net
cdrom
text
eula --agreed
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8
rootpw --plaintext root
timezone Europe/Moscow --utc
network --bootproto=dhcp --device=link --activate --onboot=on --hostname=redos-clean.lab.local
firewall --disabled
selinux --permissive
firstboot --disable
skipx
zerombr
clearpart --all --initlabel
autopart --type=plain
bootloader --location=mbr --append="nomodeset crashkernel=auto"
user --name=admin --password=admin --plaintext --groups=wheel
reboot --eject

%packages --ignoremissing
@core
openssh-server
vim-minimal
%end

%post --log=/root/ks-post.log
systemctl enable sshd || true
mkdir -p /etc/ssh/sshd_config.d
cat > /etc/ssh/sshd_config.d/99-root.conf <<'EOF'
PermitRootLogin yes
PasswordAuthentication yes
EOF
rpm -e --nodeps secretnet snlsp-firewall 2>/dev/null || true
echo "CLEAN_INSTALL_OK $(date -Iseconds)" > /root/CLEAN_INSTALL.txt
%end
